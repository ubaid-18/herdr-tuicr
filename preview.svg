<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <title>Illustrated tuicr Review panel in Herdr</title>
  <rect width="960" height="560" rx="12" fill="#171b1e"/>
  <g font-family="monospace" font-size="13" fill="#b9c4cb">
    <text x="20" y="30" font-weight="bold">Herdr</text>
    <text x="690" y="30">Files</text><text x="756" y="30">Changes</text>
    <rect x="839" y="11" width="101" height="28" rx="6" fill="#324956"/>
    <text x="859" y="30" fill="#e3f2fb">Review</text>
    <path d="M0 48h960M167 48v512M470 48v512" stroke="#364148"/>
    <text x="16" y="79" fill="#82929c">Spaces</text>
    <text x="16" y="110">This computer</text>
    <rect x="8" y="122" width="151" height="29" rx="5" fill="#2b414b"/>
    <text x="24" y="142" fill="#ecf3f8">my-project</text>
    <text x="16" y="185">remote-machine</text>
    <text x="24" y="215">another-repo</text>
    <text x="186" y="80">Terminal</text>
    <text x="186" y="120" fill="#7bd5ad">$ git status</text>
    <text x="186" y="147">On branch feature/review</text>
    <text x="186" y="174" fill="#7e9aa9">Your source pane stays here.</text>
    <text x="186" y="205" fill="#7e9aa9">Review runs beside it.</text>
    <text x="487" y="78" font-weight="bold" fill="#edf3f8">Review</text>
    <text x="563" y="78" fill="#829ba8">Local · /projects/my-project</text>
    <g fill="#2b363e">
      <rect x="486" y="92" width="87" height="27" rx="4"/>
      <rect x="581" y="92" width="119" height="27" rx="4"/>
      <rect x="708" y="92" width="94" height="27" rx="4"/>
      <rect x="810" y="92" width="75" height="27" rx="4"/>
    </g>
    <g fill="#d2dde6" font-size="12">
      <text x="497" y="110">Commits</text><text x="592" y="110">Working tree</text>
      <text x="719" y="110">Branch…</text><text x="823" y="110">Focus</text>
    </g>
    <rect x="486" y="130" width="371" height="27" rx="4" fill="#10171c" stroke="#435863"/>
    <text x="495" y="148" font-size="12">main..feature/review</text>
    <rect x="867" y="130" width="77" height="27" rx="4" fill="#2b363e"/>
    <text x="881" y="148" font-size="12">Range</text>
    <rect x="486" y="173" width="458" height="369" rx="4" fill="#10171c" stroke="#698ca3"/>
    <text x="498" y="197" fill="#a2c8e0">tuicr  ·  feature/review</text>
    <path d="M487 207h456M608 208v305" stroke="#34434e"/>
    <text x="498" y="232" font-size="12" fill="#85c9e8">Files</text>
    <text x="498" y="258" font-size="12">src/app.go</text>
    <text x="498" y="282" font-size="12" fill="#8a9aa6">README.md</text>
    <text x="623" y="232" font-size="12">src/app.go</text>
    <text x="623" y="261" font-size="12" fill="#94b7ce">@@ -12,3 +12,5 @@</text>
    <rect x="609" y="273" width="334" height="24" fill="#3a2027"/>
    <text x="623" y="290" font-size="12" fill="#f29b9b">- return loadConfig()</text>
    <rect x="609" y="297" width="334" height="48" fill="#16392c"/>
    <text x="623" y="314" font-size="12" fill="#9ed8af">+ cfg, err := loadConfig()</text>
    <text x="623" y="338" font-size="12" fill="#9ed8af">+ return cfg, err</text>
    <rect x="621" y="365" width="305" height="68" rx="5" fill="#233846"/>
    <text x="632" y="386" font-size="12" fill="#b6d8ee">Comment · src/app.go:14</text>
    <text x="632" y="411" font-size="12">Add a test for invalid config.</text>
    <path d="M487 514h456" stroke="#34434e"/>
    <text x="498" y="532" font-size="11" fill="#90a9ba">j/k move · c comment · r reviewed · y export · ? help</text>
  </g>
</svg>
